name: Stranger
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  stranger:
    # Build covers every installer, server, shared, and stranger-test change.
    # Running only after it succeeds avoids a duplicate clean-machine matrix
    # racing the API deployment from the same commit.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Stranger test
        shell: bash
        env:
          ALEXANDRIA_TEST_KEY: ${{ secrets.ALEXANDRIA_TEST_KEY }}
          ALEXANDRIA_GITHUB_API_TOKEN: ${{ github.token }}
        run: bash server/test/stranger.sh
